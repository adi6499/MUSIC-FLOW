version: '3.8'

services:
  typesense:
    image: typesense/typesense:27.1
    container_name: musicflow-typesense
    restart: on-failure
    ports:
      - "${TYPESENSE_PORT:-8108}:8108"
    environment:
      - TYPESENSE_API_KEY=${TYPESENSE_ADMIN_KEY:-mf_admin_dev_key}
      - TYPESENSE_DATA_DIR=/data
      - TYPESENSE_ENABLE_CORS=true
    volumes:
      - ./typesense-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8108/health"]
      interval: 10s
      timeout: 5s
      retries: 3
